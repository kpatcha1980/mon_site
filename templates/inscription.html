<html>
<head>
<style>
  body { font-family: Arial; background: #f0f2f5; display: flex; justify-content: center; padding-top: 50px; }
  .carte { background: white; padding: 30px; border-radius: 15px; width: 350px; box-shadow: 0 0 15px #ccc; }
  h1 { text-align: center; color: #1877f2; }
  input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 8px; }
  button { width: 100%; padding: 12px; background: #1877f2; color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; }
</style>
</head>
<body>
  <div class="carte">
    <h1>S'inscrire</h1>
    <form action="/inscription" method="POST">
      <input type="text" name="prenom" placeholder="Prénom" required>
      <input type="text" name="nom" placeholder="Nom" required>
      <input type="text" name="classe" placeholder="Classe" required>
      <input type="email" name="email" placeholder="Email" required>
      <button type="submit">S'inscrire</button>
    </form>
  </div>
</body>
</html>
